{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Assistant</title>
  <meta name="theme-color" content="#111111">
  <link rel="manifest" href="{% static 'assistant/manifest.json' %}">
  <link rel="apple-touch-icon" href="{% static 'assistant/icons/icon-192.png' %}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'assistant/css/style.css' %}">
  <link rel="icon" href="{% static 'assistant/icons/icon-192.png' %}">
</head>
<body>
  <div class="container app-shell">
    <h5 class="py-3 mb-0">🎓 AI ASSISTANT <small class="text-muted">· Lesson helper</small></h5>

    <div id="offline-banner" class="alert alert-warning d-none">
      You're offline. Reconnect to the internet to ask questions.
    </div>

    <div id="chat" class="chat-box">
      <div class="msg bot">Hi! Ask me any question about your lesson.</div>
    </div>

    <form id="chat-form" class="mt-3">
      {% csrf_token %}
      <textarea id="prompt" class="form-control" rows="2" placeholder="Ask a question for class..."></textarea>
      <div class="d-flex justify-content-between mt-2">
        <button type="button" id="clear" class="btn btn-outline-secondary">✕ Clear</button>
        <button type="submit" id="send" class="btn btn-dark">Send ▶</button>
      </div>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="{% static 'assistant/js/app.js' %}"></script>
</body>
</html>
